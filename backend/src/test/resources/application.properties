spring.application.name=nps-play-box-test
server.port=8023

# Key Paths
app.keys.private-path=src/main/resources/keys/999999.private.pem
app.keys.public-path=src/main/resources/keys/NIBSS-999999.public.pem
app.xml.output-dir=src/main/java/org/example/signer/xmlOutput

# Database & JPA Configuration for Tests (In-memory H2)
spring.datasource.url=jdbc:h2:mem:npsdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE ALIAS IF NOT EXISTS gen_random_uuid FOR 'java.util.UUID.randomUUID'
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Connection Pool & Concurrency
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=15000

# Flyway disabled for in-memory H2 tests (Hibernate ddl-auto manages test schema)
spring.flyway.enabled=false

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.oauth2.redirect-uri=http://localhost:5173/oauth2/redirect

# OAuth2 Dummy
spring.security.oauth2.client.registration.microsoft.client-id=dummy-client-id
spring.security.oauth2.client.registration.microsoft.client-secret=dummy-client-secret
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/common/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/common/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/v1.0/me
spring.security.oauth2.client.provider.microsoft.user-name-attribute=id
